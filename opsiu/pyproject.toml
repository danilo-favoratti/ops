[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsiu"
version = "0.1.0"
description = "Traceable audits of Brazilian parliamentary reimbursements."
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pytz",
    "pydantic",
    "pydantic-settings",
    "typer",
    "httpx",
    "pypdf",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "agentrig @ git+https://github.com/mtmoreira/agentrig.git@cc585b46f5365cf1997f71704302d477dd5a7685",
    "openai-codex==0.144.4",
    "ijson>=3.6.0",
]

[project.scripts]
opsiu = "opsiu.interfaces.cli:app"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "httpx"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/opsiu"]

[tool.hatch.build.targets.wheel.force-include]
".llms" = "opsiu/_llms"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "evals"]
python_version = "3.12"

# ijson has no bundled type information; its boundary is typed in json_source.py.
[[tool.mypy.overrides]]
module = ["ijson", "ijson.common"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: isolated domain and application tests",
    "contract: interfaces and adapter contract tests",
    "integration: end-to-end tests with local resources",
    "eval: opt-in agent evaluations",
]
